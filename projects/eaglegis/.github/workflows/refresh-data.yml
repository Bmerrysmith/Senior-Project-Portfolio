name: Refresh data artifacts

# Weekly (and on-demand) refresh of canonical minutes index + gold public CSV,
# then publish silver/reference to Supabase.

on:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

concurrency:
  group: refresh-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    name: collect, build, commit, publish
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - run: pip install -r requirements.txt

      - name: Scrape minutes index from estero-fl.gov
        run: python scripts/scrape_minutes_index.py

      - name: Rebuild silver + gold
        run: python -m app.pipeline.run --strict --live-geocode --verify-pdf-locations

      - name: Commit refreshed artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/data/minutes_index.json
          git add app/data/gold/meetings_public.csv
          git add app/data/gold/meetings_public.json
          git add app/data/gold/site_manifest.json
          git add app/data/gold/meetings_ai_public.csv
          git add app/data/gold/meetings_ai_public.jsonl
          git add app/data/gold/arcgis_agenda_map_data.csv
          git add app/data/silver/
          if git diff --staged --quiet; then
            echo "No artifact changes to commit."
          else
            git commit -m "chore(data): refresh minutes index and gold public CSV [skip ci]"
            git push
          fi

      - name: Publish + verify Supabase (strict)
        run: python -m app.pipeline.run --publish --verify --strict --live-geocode --verify-pdf-locations

      - name: Upload run manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: refresh-manifest-${{ github.run_id }}
          path: app/data/runs/
          retention-days: 90
          if-no-files-found: warn

      - name: Summarize manifest in job summary
        if: always()
        run: |
          LATEST=$(ls -td app/data/runs/*/ 2>/dev/null | head -n1)
          if [ -n "$LATEST" ] && [ -f "$LATEST/manifest.json" ]; then
            {
              echo "## Refresh data manifest"
              echo ""
              echo '```json'
              cat "$LATEST/manifest.json"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
